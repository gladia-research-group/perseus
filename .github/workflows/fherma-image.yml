# Builds docker/Dockerfile.fherma and pushes it to ghcr.io/<owner>/perseus-core, the image proposed to FHERMA. A v*
# tag publishes that version (v0.1.0 -> :0.1.0), a push to main that touches the runtime publishes :main, and a pull
# request that touches it only builds, to show the image still does. The digest, which is what FHERMA pins, is
# written to the run summary.
name: fherma-image

on:
  push:
    branches: [main]
    tags: ['v*']
    # tag pushes ignore the path filter
    paths:
      - 'crates/**'
      - 'python/perseus/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'docker/Dockerfile.fherma'
      - 'docker/build-fherma.sh'
      - '.dockerignore'
      - '.github/workflows/fherma-image.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'python/perseus/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'docker/Dockerfile.fherma'
      - 'docker/build-fherma.sh'
      - '.dockerignore'
      - '.github/workflows/fherma-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The CUDA devel base alone is ~4 GB compressed; the runner's preinstalled toolchains are not needed and leave
      # too little room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perseus-core
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          # GitHub does not recognise the Business Source License, so the label is set here rather than taken
          # from the repository.
          labels: |
            org.opencontainers.image.title=perseus-core
            org.opencontainers.image.licenses=BUSL-1.1

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          file: docker/Dockerfile.fherma
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}

      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/perseus-core@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Built from \`${{ github.sha }}\`, docker/Dockerfile.fherma."
          } >> "$GITHUB_STEP_SUMMARY"
