# The PR check of the Encrypted GPT-2 Speedrun, for every PR to the speedrun branch, before a maintainer is notified:
# speedrun/harness/check_pr.py (the speedrun's harness, rules and records left alone; for an entry, its record folder,
# submission.json, the declared CKKS parameters at 128-bit security, the client's code and the CLA). GitHub runs
# pull_request_target workflows from the default branch, so this file lives on main and checks out the PR's base on
# speedrun, whose checker it runs; it reads the PR through git only, so no submitted code runs here, and the PR's
# description reaches it as a file. A plain PR that passes gets no comment. An entry that passes is labelled `checked`
# and its review requested; a failure is labelled `check-failed` and explained in a comment. A check that does not
# run to the end fails, never passes. A repository Actions policy allows pull_request_target for this file
# (speedrun/MAINTAINING.md); the action is pinned to a commit, since the job holds a write token.
name: Speedrun PR check
on:
  pull_request_target:
    branches: [speedrun]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the PR without running it
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - name: Check
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          ok=1
          python3 speedrun/harness/check_pr.py --base "${{ github.event.pull_request.base.sha }}" --head pr-head \
            --author "$AUTHOR" --body "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/report.md" || ok=0
          if [ "$ok" = 0 ] && [ ! -s "$RUNNER_TEMP/report.md" ]; then
            printf '%s\n' '<!-- speedrun-pr-check -->' \
              '**PR check: failed.** The check did not run to the end; a maintainer looks at it.' > "$RUNNER_TEMP/report.md"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md"
      - name: Report and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s "$RUNNER_TEMP/report.md" ] || exit 0
          gh label create checked --color 0e8a16 --force >/dev/null
          gh label create check-failed --color d93f0b --force >/dev/null
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/report.md" ||
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"
          if [ "${{ steps.check.outputs.ok }}" = 1 ]; then
            gh pr edit "$PR" --add-label checked --remove-label check-failed
            for r in alexzilligmm Davide-F5-Marincione; do gh pr edit "$PR" --add-reviewer "$r" || true; done
          else
            gh pr edit "$PR" --add-label check-failed --remove-label checked
            exit 1
          fi
