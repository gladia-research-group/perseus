[package]
name = "pc-program"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "perseus: graph + plan -> Program (name resolution, plan application, compile-time level check, K-batching, buffer assignment; CUDA-free) and, with feature `gpu`, its replay (bind, CUDA graphs, weight ring, KV choreography)"

[dependencies]
pc-config = { path = "../pc-config" }
pc-shadow = { path = "../pc-shadow" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# feature `gpu`: bind / replay / residency / kv on the device runtime
pc-core = { path = "../pc-core" }
pc-cuda = { path = "../pc-cuda", optional = true }
pc-gpu = { path = "../pc-gpu", optional = true }
pc-kernels = { path = "../pc-kernels", optional = true }
rayon = { workspace = true, optional = true }

[features]
default = []
gpu = ["dep:pc-cuda", "dep:pc-gpu", "dep:pc-kernels", "dep:rayon"]
