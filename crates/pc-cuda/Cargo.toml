[package]
name = "pc-cuda"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "perseus: hand-written cudart FFI with safe wrappers (device guard, lane-typed streams, events, graphs, arena memory)"

[features]
# cuBLASLt int8 -> int32 GEMM: pc-cublas re-exported by src/blas.rs, version-checked at handle creation.
cublas = ["dep:pc-cublas"]

[dependencies]
# DevPrimeConst is a device-uploadable type (`Pod`); pc-core is CUDA-free, so this edge adds no CUDA to it
pc-core = { path = "../pc-core" }
thiserror = { workspace = true }
pc-hostrt = { path = "../pc-hostrt" }
pc-cublas = { path = "../pc-cublas", optional = true }
