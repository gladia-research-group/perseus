[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perseus"
dynamic = ["version"]
description = "GPU FHE inference for transformer LMs under CKKS — HF download, calibration, weight packing, bootstrap planning, deployment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Core: what `perseus.plan` and `perseus.nn` need. The CUDA extension (`perseus._core`)
# is built separately (README: Install); everything under `perseus.nn` needs it at runtime.
dependencies = [
    "numpy",
    "networkx>=3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# HuggingFace acquisition, export and calibration (`perseus.hub`, `perseus.export`,
# `perseus.calibrate`, `perseus.nn.calibrate`, the three console scripts).
hf = [
    "torch>=2.5",
    "transformers>=4.57.6",
    "huggingface_hub",
    "datasets>=2.19",
    "tqdm>=4.67.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scipy>=1.17.1",
    "mpmath>=1.3",
]
# Building the extension, running the tests, generating stubs, executing notebooks.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pybind11>=3.1",
    "pybind11-stubgen",
    "nbformat",
    "nbclient",
    "ipykernel",
]
all = ["perseus[hf,dev]"]

# `uv sync` installs this group by default (tool.uv.default-groups below), so the
# repo venv keeps the full toolchain. Keep the list in sync with the extras above.
[dependency-groups]
dev = [
    "torch>=2.5",
    "transformers>=4.57.6",
    "huggingface_hub",
    "datasets>=2.19",
    "tqdm>=4.67.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scipy>=1.17.1",
    "mpmath>=1.3",
    "pytest>=8",
    "ruff>=0.6",
    "pybind11>=3.1",
    "pybind11-stubgen",
    "nbformat",
    "nbclient",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/gladia-research-group/perseus"
Repository = "https://github.com/gladia-research-group/perseus"
Issues = "https://github.com/gladia-research-group/perseus/issues"

[project.scripts]
perseus-export = "perseus.export:main"
perseus-calibrate = "perseus.calibrate.cli:main"
perseus-plan = "perseus.plan.placer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "perseus.__version__" }

[tool.setuptools.packages.find]
include = ["perseus*"]

[tool.setuptools.package-data]
perseus = [
    "configs/**/*.yaml",
    "plan/data/*.json",
    "plan/placer/baselines/*.json",
    "py.typed",
    "*.pyi",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not gpu'"
markers = [
    "gpu: needs a CUDA device and the perseus._core extension (run with: pytest -m gpu tests/gpu)",
    "slow: minutes, not seconds (keygen, bundle serialization); PERSEUS_SLOW=1 enables",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["perseus", "tests"]
extend-exclude = [
    "perseus/_core.pyi",   # generated by scripts/utils/gen_core_stub.py
    "perseus/_client.pyi", # generated by scripts/utils/gen_core_stub.py perseus._client
    "third_party",
    "build*",
    "deps_*",
    "notebooks",
    "paper-workshop",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length: 300 hits in the planner; formatter territory, not a gate yet
    "E701",   # compound statements: 44 hits, mostly the figure/utility scripts
    "E702",
    "E741",
    "B905",   # zip(strict=) — fixed per call site, not by a blanket unsafe fix
    "B023",   # closures consumed inside the same loop iteration (verified, not bugs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]          # imports after pytest.importorskip / sys.path setup
"perseus/plan/placer/planner.py" = ["E402"]
"scripts/modes_baseline.py" = ["E402"]   # the extension is imported after the mode check

[tool.ruff.lint.isort]
known-first-party = ["perseus"]
