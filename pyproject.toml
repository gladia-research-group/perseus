[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "perseus"
requires-python = ">=3.12"
dynamic = ["version"]
description = "A full-stack system for homomorphic model inference"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["numpy", "networkx>=3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# HuggingFace acquisition, export and calibration (`perseus.hub`, `perseus.export`, `perseus.calibrate`)
hf = [
    "torch>=2.5",
    "transformers>=4.57",
    "huggingface_hub",
    "datasets>=2.19",
    "tqdm>=4.67",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scipy>=1.17",
    "mpmath>=1.3",
]
# what the example drivers import for their plaintext references, tokenizers and checkpoints (BERT, ViT, Llama)
examples = ["torch>=2.5", "transformers>=4.57", "safetensors", "huggingface_hub", "pillow", "scipy>=1.17"]
dev = ["pytest>=8", "ruff>=0.6", "maturin>=1.7", "scipy>=1.17", "nbformat", "nbclient", "ipykernel"]

[project.urls]
Homepage = "https://github.com/gladia-research-group/perseus"
Repository = "https://github.com/gladia-research-group/perseus"
Issues = "https://github.com/gladia-research-group/perseus/issues"
Paper = "https://arxiv.org/abs/2611.04488"

[project.scripts]
perseus-export = "perseus.export:main"
perseus-calibrate = "perseus.calibrate.cli:main"
perseus-plan = "perseus.plan.placer.__main__:main"
perseus-t2i = "perseus.examples.sana.cli:main"

[tool.maturin]
manifest-path = "crates/pc-py/Cargo.toml"
python-source = "python"
module-name = "perseus._pc"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = "-m 'not gpu'"
markers = ["gpu: needs the GPU (run through tools/gpu.sh)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python"]
