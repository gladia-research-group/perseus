[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perseus"
version = "0.1.0"
description = "GPU FHE inference for transformer LMs under CKKS — HF download, calibration, weight packing, bootstrap planning, deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.17.1",
    "torch>=2.5",
    "transformers>=4.57.6",
    "datasets>=2.19",
    "tqdm>=4.67.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "networkx>=3",
    "pybind11>=3.1",
]

[project.scripts]
perseus-export = "perseus.export:main"
perseus-calibrate = "perseus.calibrate.cli:main"
perseus-plan = "perseus.plan.__main__:main"

[tool.setuptools.packages.find]
include = ["perseus*"]

[tool.setuptools.package-data]
perseus = ["configs/**/*.yaml"]
