name: "google/vit-base-patch16-224"
batch_size: 8          # calibration micro-batch (images)
block_size: null       # unused for image models
resolution: null

instance:
  _target_: transformers.AutoModelForImageClassification.from_pretrained
  pretrained_model_name_or_path: ${model.name}
  device_map: null
  torch_dtype: "auto"
  trust_remote_code: False
  attn_implementation: "eager"   # required: the softmax tap needs the eager path
