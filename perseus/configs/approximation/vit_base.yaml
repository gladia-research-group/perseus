# ViT approximation set: the GPT-2 fits with bidirectional softmax (uniform
# kc = T, no decode window) and the 1.5 GELU operating point (no outlier feature).

defaults:
  - gpt2
  - _self_

name: vit_base

norm:
  # Cap INERT (GPT-2 parity). The old 0.4 anti-detonation cap patched the
  # misdiagnosed "inv_sqrt tilt" (really the bootstrap-envelope smear, fixed in
  # norm.cu + the band widening below). Worse, at depth it crushed cs2 by
  # ~1000x (cs2_cap = 0.4/var_max with huge pool var_max), landing most tokens'
  # var_scaled at 3e-4..1e-3 — 10..50x BELOW the bts noise floor (safe-lo 1e-2)
  # — so the b6+ variance bootstraps returned garbage and the encoder detonated.
  # Inert cap => _center_sq lands each position's median at the df target
  # (~0.35-0.77, mid precision window); max_vs falls back to basin_safety*fit_hi.
  # MEASURED (calib 49862484): the inert cap did NOT achieve that at deep sites —
  # basin_safety*fit_hi on the collapsed c²-band does the identical crushing
  # (b6-b11 medians still ~1e-3, 24/26 tokens sub-floor). floor+cap below are the
  # ABSOLUTE bts-precision window [1e-2-ish, EvalMod-wall-ish]: with both finite,
  # fit_norm derives the fit band FROM the window (so the cap cannot crush cs2 —
  # x_t lands mid-window by construction) and css floors/caps every position
  # into it. The cap's job is now only to keep the variance ct under the bts
  # wall; the floor keeps every token above the ~1e-2 abs noise floor where
  # variance bootstraps flip signs (b11 var_raw t0=-54.7).
  rescale_max_var_scaled: 5.0
  rescale_min_var_scaled_nl: 0.03
  rescale_min_var_scaled: 0.35
  # Content-determined variance escapes the pool-derived fit band per image
  # (gate image pool[0] tok12: css·var = 0.0113 vs fit_lo 0.025). Off-band lanes
  # blow the Newton y² past the bootstrap EvalMod wall (~10) and one in-loop bts
  # then corrupts EVERY token (uniform additive smear). Widen the low edge 6x and
  # cap the inv_sqrt output at 2.5 so the whole Newton trajectory (incl. the
  # ±10% remez init overshoot over the wider band) stays inside the wall:
  # max y² = (2.5·1.10)² ≈ 7.6 < 10. Exact-arith convergence at deg-3/1 + GS12
  # + NR3 over the 2100x band verified to <1e-6.
  z_min_safety: 6.0
  inv_y_max: 2.5

gelu:
  raw_max_safety: 1.5

softmax:
  bidirectional: true
  decode_window: null
